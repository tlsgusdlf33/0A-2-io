# 유튜브/틱톡 영상 제작(무료 스택) → 비공개 저장소 Release
name: video
on:
  workflow_dispatch:
    inputs: {req: {required: true}}
  workflow_call:
    inputs: {req: {type: string, required: true}}
permissions: {contents: read}
jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      REQ: '${{ inputs.req }}'
      GH_TOKEN: '${{ secrets.OA2_TOKEN }}'
      GEMINI_API_KEY: '${{ secrets.GEMINI_API_KEY }}'
      CLAUDE_CODE_OAUTH_TOKEN: '${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}'
      PEXELS_API_KEY: '${{ secrets.PEXELS_API_KEY }}'
      PIXABAY_API_KEY: '${{ secrets.PIXABAY_API_KEY }}'
      NTFY_TOPIC: '${{ secrets.NTFY_TOPIC }}'
      MAIL_USER: '${{ secrets.MAIL_USER }}'
      MAIL_PASS: '${{ secrets.MAIL_PASS }}'
      MAIL_TO: '${{ secrets.MAIL_TO }}'
    steps:
      - uses: actions/checkout@v4
      - run: bash .github/guard.sh
      - uses: actions/checkout@v4
        with: {repository: tlsgusdlf33/0A-2, token: '${{ secrets.OA2_TOKEN }}', path: src}
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-cjk >/dev/null
          pip install -q edge-tts pillow
      - run: cd src && python3 tools/video.py "$REQ"
      - name: 실패 처리
        if: failure()
        run: |
          cd src && python3 -c "import sys;sys.path.insert(0,'tools');from common import *;import notify;req_update('$REQ',status='failed',error='영상 제작 실패(워크플로우 로그 참고)');commit('video fail',['requests']);notify.send('영상 제작 실패','앱제작 앱 작업현황에서 다시 시도하세요.')"
      - if: always()
        run: rm -rf src video_tmp final.mp4
