# 매일 오전 6시(KST) 아이디어: 앱별 기능향상·수익화·관심끌기 각 3개 + 신규 앱 3개 + AdMob 수익 분석 (Gemini 무료 API)
name: ideas
on:
  schedule: [{cron: '0 21 * * *'}]
  workflow_dispatch:
  workflow_call:
    inputs: {req: {type: string, default: ''}}
permissions: {contents: read}
jobs:
  ideas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REQ: '${{ inputs.req }}'
      GEMINI_API_KEY: '${{ secrets.GEMINI_API_KEY }}'
      CLAUDE_CODE_OAUTH_TOKEN: '${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}'
      ADMOB_CLIENT_ID: '${{ secrets.ADMOB_CLIENT_ID }}'
      ADMOB_CLIENT_SECRET: '${{ secrets.ADMOB_CLIENT_SECRET }}'
      ADMOB_REFRESH_TOKEN: '${{ secrets.ADMOB_REFRESH_TOKEN }}'
      ADMOB_PUBLISHER_ID: '${{ secrets.ADMOB_PUBLISHER_ID }}'
      NTFY_TOPIC: '${{ secrets.NTFY_TOPIC }}'
      MAIL_USER: '${{ secrets.MAIL_USER }}'
      MAIL_PASS: '${{ secrets.MAIL_PASS }}'
      MAIL_TO: '${{ secrets.MAIL_TO }}'
    steps:
      - uses: actions/checkout@v4
      - run: bash .github/guard.sh
      - uses: actions/checkout@v4
        with: {repository: tlsgusdlf33/0A-2, token: '${{ secrets.OA2_TOKEN }}', path: src}
      - run: cd src && python3 tools/ideas.py "$REQ" > /dev/null
      - if: always()
        run: rm -rf src
